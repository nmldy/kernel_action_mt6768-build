name: Build Kernel for APatch

on:
  workflow_dispatch:
    inputs:
      BUILD_APATCH:
        description: "编译 APatch 支持的内核（仅启用 KALLSYMS）"
        required: false
        default: "true"
        type: boolean

env:
  CONFIG_ENV: config.env

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Read config.env
      id: cfg
      run: |
        set -a
        source config.env
        set +a
        echo "KERNEL_SOURCE=${KERNEL_SOURCE}" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=${KERNEL_SOURCE_BRANCH}" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=${KERNEL_CONFIG}" >> $GITHUB_ENV
        echo "KERNEL_IMAGE_NAME=${KERNEL_IMAGE_NAME}" >> $GITHUB_ENV
        echo "KERNEL_ARCH=${KERNEL_ARCH}" >> $GITHUB_ENV
        echo "USE_CUSTOM_ANYKERNEL3=${USE_CUSTOM_ANYKERNEL3}" >> $GITHUB_ENV
        echo "CUSTOM_ANYKERNEL3_SOURCE=${CUSTOM_ANYKERNEL3_SOURCE}" >> $GITHUB_ENV
        echo "CUSTOM_ANYKERNEL3_BRANCH=${CUSTOM_ANYKERNEL3_BRANCH}" >> $GITHUB_ENV
        echo "ADD_KPROBES_CONFIG=true" >> $GITHUB_ENV

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential bc bison flex libssl-dev libbz2-dev zlib1g-dev ccache zip curl unzip xz-utils liblz4-tool lzop device-tree-compiler python3 python-is-python3 git make
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download AOSP Clang (r450784e)
      run: |
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace/clang/clang-r450784e
        cd $GITHUB_WORKSPACE/kernel_workspace/clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz
        tar -xzf clang-r450784e.tar.gz -C clang-r450784e
        rm -f clang-r450784e.tar.gz
        echo "$GITHUB_WORKSPACE/kernel_workspace/clang/clang-r450784e/bin" >> $GITHUB_PATH
        $GITHUB_WORKSPACE/kernel_workspace/clang/clang-r450784e/bin/clang --version

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive ${KERNEL_SOURCE} -b ${KERNEL_SOURCE_BRANCH} android-kernel --depth=1
        cd android-kernel
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Patch kernel source (fix i2c-mtk)
      run: |
        cd $KERNEL_DIR
        sed -i 's/if ((id == 1) || (id == 6) || (id == 8))/if ((i2c->id == 1) || (i2c->id == 6) || (i2c->id == 8))/' drivers/i2c/busses/i2c-mtk.c
        grep -n "i2c->id == 1" drivers/i2c/busses/i2c-mtk.c

    - name: Modify Defconfig (APatch Support)
      run: |
        cd $KERNEL_DIR
        DEFCONFIG=arch/arm64/configs/${KERNEL_CONFIG}
        
        sed -i '/CONFIG_KSU/d' $DEFCONFIG
        sed -i '/CONFIG_KALLSYMS_ALL/d' $DEFCONFIG
        sed -i '/CONFIG_KALLSYMS_BASE_RELATIVE/d' $DEFCONFIG
        sed -i '/CONFIG_LTO/d' $DEFCONFIG
        sed -i '/CONFIG_LTO_CLANG/d' $DEFCONFIG
        sed -i '/CONFIG_THINLTO/d' $DEFCONFIG
        
        echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
        echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
        echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> $DEFCONFIG
        echo "# CONFIG_LTO is not set" >> $DEFCONFIG
        echo "# CONFIG_LTO_CLANG is not set" >> $DEFCONFIG
        echo "# CONFIG_THINLTO is not set" >> $DEFCONFIG
        
        echo "---- defconfig check ----"
        grep -E "CONFIG_(KALLSYMS|KSU|LTO)" $DEFCONFIG || true

    - name: Build kernel
      run: |
        cd $KERNEL_DIR
        MAKE_FLAGS="CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1"
        
        make O=out ARCH=${KERNEL_ARCH} ${MAKE_FLAGS} ${KERNEL_CONFIG}
        make O=out ARCH=${KERNEL_ARCH} ${MAKE_FLAGS} olddefconfig
        
        echo "---- out/.config actual config ----"
        grep -E "CONFIG_(KALLSYMS|KALLSYMS_ALL|KSU)=" out/.config || true
        
        if ! grep -q "^CONFIG_KALLSYMS=y" out/.config; then
          echo "::error::CONFIG_KALLSYMS missing"
          exit 1
        fi
        if ! grep -q "^CONFIG_KALLSYMS_ALL=y" out/.config; then
          echo "::error::CONFIG_KALLSYMS_ALL missing"
          exit 1
        fi
        if grep -q "^CONFIG_KSU=y" out/.config; then
          echo "::error::CONFIG_KSU exists! Stop building."
          exit 1
        fi
        
        make -j$(nproc) O=out ARCH=${KERNEL_ARCH} ${MAKE_FLAGS} KCFLAGS="-fcommon"

    - name: Check kernel output files
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ -f android-kernel/out/arch/${KERNEL_ARCH}/boot/${KERNEL_IMAGE_NAME} ]; then
            echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
            ls -lh android-kernel/out/arch/${KERNEL_ARCH}/boot/
        else
            echo "Kernel output not found!"
            exit 1
        fi

    - name: Prepare AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ "${USE_CUSTOM_ANYKERNEL3}" = "true" ] && [ -n "${CUSTOM_ANYKERNEL3_SOURCE}" ]; then
          git clone ${CUSTOM_ANYKERNEL3_SOURCE} -b ${CUSTOM_ANYKERNEL3_BRANCH} --depth=1 AnyKernel3
        else
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        
        if [ -f android-kernel/out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb ]; then
          cp android-kernel/out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb AnyKernel3/
        elif [ -f android-kernel/out/arch/${KERNEL_ARCH}/boot/Image.gz ]; then
          cp android-kernel/out/arch/${KERNEL_ARCH}/boot/Image.gz AnyKernel3/
        elif [ -f android-kernel/out/arch/${KERNEL_ARCH}/boot/Image ]; then
          cp android-kernel/out/arch/${KERNEL_ARCH}/boot/Image AnyKernel3/
        fi
        ls -lh AnyKernel3/

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-merlin-apatch-${{ github.run_id }}
        path: kernel_workspace/AnyKernel3/*
        if-no-files-found: error

    - name: Upload kernel image (backup)
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image-merlin-apatch-${{ github.run_id }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
        if-no-files-found: ignore
