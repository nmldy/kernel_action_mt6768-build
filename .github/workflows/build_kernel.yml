name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup kernel build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download GCC Compilers
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-32

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive https://github.com/Jbub5/android_kernel_xiaomi_mt6768 -b kernel-tree android-kernel --depth=1

    - name: Modify Defconfig (Direct sed)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        DEFCONFIG=arch/arm64/configs/merlin_defconfig
        
        # 暴力文本替换，开启 KPROBES 和 KALLSYMS_ALL
        sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/g' $DEFCONFIG
        sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/g' $DEFCONFIG
        sed -i 's/# CONFIG_KALLSYMS_BASE_RELATIVE is not set/CONFIG_KALLSYMS_BASE_RELATIVE=y/g' $DEFCONFIG
        sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/g' $DEFCONFIG
        
        # 关闭 LTO 防止链接报错
        sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' $DEFCONFIG
        sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' $DEFCONFIG
        sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/g' $DEFCONFIG

        # 修复 Ubuntu 22.04 编译老内核的 yylloc 必然报错
        sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c 2>/dev/null || true
        sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l 2>/dev/null || true

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$PATH
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export KCFLAGS=-fno-common
        
        make -j4 O=out ARCH=arm64 merlin_defconfig
        make -j4 O=out ARCH=arm64

    - name: Check a kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       elif [ -f android-kernel/out/arch/arm64/boot/Image.gz ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi

    - name: Make Custom-Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/Jbub5/AnyKernel3.git -b proton --depth=1 AnyKernel3
        if [ -f android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        else
          cp android-kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-merlin
        path: kernel_workspace/AnyKernel3/*
